<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Open Source Art</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect shim.
      // Rewrites a deep-linked/refreshed path into a query the SPA can restore,
      // so /opensource/research/modulations survives a hard refresh.
      // pathSegmentsToKeep = 1 keeps the '/opensource' base segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
